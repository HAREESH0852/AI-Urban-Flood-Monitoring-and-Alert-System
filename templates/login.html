<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Urban Flood AI | Login</title>
</head>
<body class="auth-wrapper" style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);">
    <div class="auth-card" style="text-align: center;">
        <h1 style="color: var(--primary); margin-bottom: 5px;">Urban Flood AI</h1>
        <p style="margin-bottom: 25px; font-size: 14px; color: var(--text-muted);">Urban Flood Monitoring & Alert System</p>
        
        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group" style="margin-bottom: 15px; text-align: left;">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="admin">
            </div>
            <div class="form-group" style="margin-bottom: 20px; text-align: left;">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary" style="width:100%;">Access System</button>
        </form>
    </div>
</body>
</html>
